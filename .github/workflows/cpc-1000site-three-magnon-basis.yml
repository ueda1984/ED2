name: CPC constructive 1000-site three-magnon Gamma basis audit

on:
  push:
    branches:
      - codex/ed2-cpc-stationary-dm-scaling
    paths:
      - "tests/cpc_independent_1000site_three_magnon_basis.py"
      - ".github/workflows/cpc-1000site-three-magnon-basis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-three-magnon-orbits:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent matrix dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2"
      - name: Enumerate all translation orbits and verify Hermitian matrix
        run: |
          OPENBLAS_NUM_THREADS=1 python tests/cpc_independent_1000site_three_magnon_basis.py \
            --report cpc-independent-1000site-three-magnon.json \
            --matrix cpc-independent-1000site-three-magnon.npz
      - name: Archive sparse matrix and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-1000site-three-magnon-independent-matrix
          path: |
            cpc-independent-1000site-three-magnon.json
            cpc-independent-1000site-three-magnon.npz
          retention-days: 30
          if-no-files-found: warn
