name: ED2 optional CSR-only padded cache release proof

on:
  push:
    branches: [codex/ed2-main-csr-release-padded]
    paths:
      - "source/ham2vec.f90"
      - "tests/cpc_csr_matvec_driver.f90"
      - "tests/cpc_csr_release_regression.py"
      - ".github/workflows/main-csr-release.yml"
  pull_request:
    paths:
      - "source/ham2vec.f90"
      - "tests/cpc_csr_matvec_driver.f90"
      - "tests/cpc_csr_release_regression.py"
      - ".github/workflows/main-csr-release.yml"
  workflow_dispatch:

jobs:
  native-csr-memory:
    name: Complete CSR H-vector triplet equivalence (gfortran-${{ matrix.gnu }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gnu: [13, 14]
    steps:
      - uses: actions/checkout@v4
      - name: Build tools and scientific BLAS/LAPACK
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gfortran-${{ matrix.gnu }} libopenblas-dev liblapack-dev \
            autoconf automake make python3
      - name: Build original main plus default-off CSR release
        run: |
          autoreconf -vfi
          # This independent experimental branch was based on the
          # unmodernized main. Its original eigen_solver.f90 has legacy
          # LAPACK argument mismatches; once PR27 is merged, remove
          # the compatibility flag in this workflow as a follow-up.
          ./configure FC=gfortran-${{ matrix.gnu }} \
            FCFLAGS="-O2 -fopenmp -fallow-argument-mismatch"
          make -j2
          make check
      - name: Build native full complex-vector and independent dense-H oracle
        run: |
          gfortran-${{ matrix.gnu }} -O2 -fopenmp -I source \
            -o "$RUNNER_TEMP/cpc-csr-release-driver" \
            tests/cpc_csr_matvec_driver.f90 \
            source/input_param.o source/state_lists.o source/ham2vec.o \
            -llapack -lopenblas
      - name: Three-mode exact H-vector bits and CSR-only memory accounting
        run: |
          python3 -B tests/cpc_csr_release_regression.py \
            --driver "$RUNNER_TEMP/cpc-csr-release-driver" \
            --output "$RUNNER_TEMP/csr-release-proof" \
            --sizes 4,6,8 --threads 1,4 --timeout 180
          test -s "$RUNNER_TEMP/csr-release-proof/summary.json"
      - name: Retain raw native outputs and memory provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-csr-release-gnu${{ matrix.gnu }}
          path: |
            ${{ runner.temp }}/csr-release-proof/summary.json
            ${{ runner.temp }}/csr-release-proof/*/stdout.log
            tests/test-suite.log
          retention-days: 30
          if-no-files-found: warn
