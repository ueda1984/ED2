name: CPC interacting eight-site sparse low-doublet verification

on:
  push:
    branches:
      - codex/ed2-cpc-stationary-dm-scaling
    paths:
      - ".github/workflows/cpc-interacting-8site-sparse-doublet.yml"
      - "tests/cpc_stationary_interacting_sparse_doublet.py"
      - "tests/plot_cpc_interacting_sparse_doublet.py"
      - "docs/development/cpc-interacting-8site-raw-ci.csv"
      - "tests/mixed_spin_interacting_avoided_crossing.py"
      - "tests/mixed_spin_doublet_trace.py"
      - "tests/mixed_spin_dm_chirality_scan.py"
      - "tests/mixed_spin_sparse_scale.py"
      - "tests/Makefile.am"
      - "source/**"
      - "configure.ac"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interacting:
    name: "Interacting 8-site doublet OMP=${{ matrix.omp }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        omp: [1,2]
    env:
      FC: gfortran-13
      FCFLAGS: "-O2 -fopenmp"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: Install Fortran and independently implemented sparse references
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran-13 libopenblas-dev liblapack-dev autoconf automake make python3-numpy python3-scipy time
      - name: Build from freshly extracted source distribution
        run: |
          set -eu
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          make dist
          root="$RUNNER_TEMP/ed2-interacting"
          mkdir -p "$root/src" "$root/build"
          tgz=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$tgz"
          tar -xzf "$tgz" -C "$root/src"
          src=$(find "$root/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$src/tests/cpc_stationary_interacting_sparse_doublet.py"
          printf '%s\n' "$src" > "$root/source-path"
          cd "$root/build"
          "$src/configure" FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Independent interacting sparse projector and native second-state readback
        run: |
          set -eu
          root="$RUNNER_TEMP/ed2-interacting"
          src=$(cat "$root/source-path")
          python3 "$src/tests/cpc_stationary_interacting_sparse_doublet.py" \
            --exe "$root/build/source/QS3ED2" \
            --omp "${{ matrix.omp }}" \
            --output "$RUNNER_TEMP/cpc-interacting-omp${{ matrix.omp }}"
          python3 - "$RUNNER_TEMP/cpc-interacting-omp${{ matrix.omp }}/report.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["pass_complete"],r["failures"]
          assert r["passed"]==r["expected"]==10
          assert all(x["status"]=="passed" for x in r["results"])
          assert all(x["trace_mag_max_error"]<=1e-5 and
                     x["trace_corr_max_error"]<=1e-5 for x in r["results"])
          for model in r["reference"]:
              assert model["outside_gap"]>.05
              assert model["edge_linear_entropy"]>0
              assert min(model["edge_commutators"])>1e-7
          print("INTERACTING EIGHT-SITE SPARSE DOUBLETS",r["passed"],"/",r["expected"],"ACCEPTED")
          PY
      - name: Retain references, native vectors, observables and residual logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interacting-sparse-doublet-omp${{ matrix.omp }}
          path: ${{ runner.temp }}/cpc-interacting-omp${{ matrix.omp }}/
          retention-days: 21
          if-no-files-found: warn

  frozen-plot:
    name: Check 20 accepted sparse doublets and produce SVG/PNG
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install headless matplotlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-numpy python3-matplotlib
      - name: Enforce complete CI provenance, gap and trace bounds
        run: |
          set -eu
          python3 tests/plot_cpc_interacting_sparse_doublet.py --validate-only
      - name: Draw accepted interacting low-doublet data
        run: |
          set -eu
          python3 tests/plot_cpc_interacting_sparse_doublet.py \
            --outdir "$RUNNER_TEMP/cpc-interacting-figures"
          test "$(find "$RUNNER_TEMP/cpc-interacting-figures" -maxdepth 1 -name '*.svg' | wc -l)" -eq 3
          test "$(find "$RUNNER_TEMP/cpc-interacting-figures" -maxdepth 1 -name '*.png' | wc -l)" -eq 3
          test -s "$RUNNER_TEMP/cpc-interacting-figures/interacting-sparse-summary.csv"
          sha256sum "$RUNNER_TEMP/cpc-interacting-figures"/*.svg
      - name: Retain all plot prototypes and data-derived summary
        uses: actions/upload-artifact@v4
        with:
          name: cpc-interacting-8site-figures
          path: ${{ runner.temp }}/cpc-interacting-figures/
          retention-days: 21
          if-no-files-found: error
