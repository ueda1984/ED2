name: One-shot large-sector point-group characterization

on:
  push:
    branches: [codex/ed2-cpc-pointgroup-performance]
    paths: [".github/workflows/cpc-pointgroup-stress-once.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-large:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FC: gfortran-14
      FCFLAGS: -O2 -fopenmp
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran-14 libblas-dev liblapack-dev autoconf automake make time
      - name: Build production ED2
        run: |
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
      - name: Run 8x8 and 10x10 physical phase characterization
        run: |
          make check-pointgroup-profile PGPROFILE_OUTPUT="$RUNNER_TEMP/large-pointgroup-profile" PGPROFILE_FLAGS="--tier stress --sizes 8,10 --threads 1 --modes two-stage --repeat 1 --timeout 600"
          python3 - "$RUNNER_TEMP/large-pointgroup-profile/report.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["passed"] and len(r["results"])==8
          for side in (8,10):
            t=r["fixtures"][f"square{side}-gamma-t"]["dimension"]
            a=r["fixtures"][f"square{side}-gamma-a1"]["dimension"]
            assert a<t
          print("LARGE PHYSICAL PROFILE OK: 8 native sector runs (no timing pass/fail criterion)")
          PY
      - name: Upload complete logs, exact inputs and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-pointgroup-profile
          path: ${{ runner.temp }}/large-pointgroup-profile/
          if-no-files-found: warn
          retention-days: 30
