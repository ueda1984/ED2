name: CPC sparse mixed-spin scaling validation

on:
  push:
    branches:
      - codex/ed2-cpc-sparse-scaling
    paths:
      - ".github/workflows/cpc-sparse-scaling.yml"
      - "tests/mixed_spin_*.py"
      - "tests/Makefile.am"
      - "source/**"
      - "configure.ac"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixed-spin-scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FC: gfortran-13
      FCFLAGS: "-O2 -fopenmp"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install independent sparse reference and compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran-13 libopenblas-dev liblapack-dev autoconf automake make python3-numpy python3-scipy time
      - name: Create release source archive
        run: |
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          make dist
          git rev-parse HEAD
      - name: Unpack and rebuild separately
        run: |
          set -eu
          work="$RUNNER_TEMP/ed2-cpc-sparse"
          mkdir -p "$work/src" "$work/build"
          tarball=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$tarball"
          tar -xzf "$tarball" -C "$work/src"
          src=$(find "$work/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          printf '%s\n' "$src" > "$work/source-path"
          cd "$work/build"
          "$src/configure" FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          python3 -c "import numpy,scipy; print('numpy',numpy.__version__,'scipy',scipy.__version__)"
      - name: Cross-check 8/10-site low eigenpairs and observables with independent sparse ED
        run: |
          set -eu
          work="$RUNNER_TEMP/ed2-cpc-sparse"
          src=$(cat "$work/source-path")
          python3 "$src/tests/mixed_spin_sparse_scale.py" \
            --exe "$work/build/source/QS3ED2" \
            --threads 1 --sizes 8,10 \
            --output "$work/results-omp1"
          python3 - "$work/results-omp1/report.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          print("SPARSE VERIFICATION:",report["passed"],"passed;",report["failed"],"failed")
          if report["total"]!=6 or report["passed"]!=6 or report["failed"]!=0:
              raise SystemExit("Sparse scaling verification failed")
          PY
      - name: Preserve input decks, ED2 logs and numerical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-sparse-scaling-omp1
          path: ${{ runner.temp }}/ed2-cpc-sparse/results-omp1/
          if-no-files-found: warn
          retention-days: 14
