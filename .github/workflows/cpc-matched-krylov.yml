name: CPC matched Krylov benchmark

on:
  push:
    branches:
      - codex/ed2-cpc-matched-solver-benchmark
    paths:
      - ".github/workflows/cpc-matched-krylov.yml"
      - "tests/mixed_spin_*.py"
      - "tests/Makefile.am"
      - "source/**"
      - "configure.ac"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accuracy-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FC: gfortran-13
      FCFLAGS: "-O2 -fopenmp"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain and independent sparse reference
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran-13 libopenblas-dev liblapack-dev autoconf automake make python3-numpy python3-scipy time
      - name: Rebuild from a new source distribution
        run: |
          set -eu
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          make dist
          work="$RUNNER_TEMP/ed2-matched"
          mkdir -p "$work/source" "$work/build"
          archive=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          tar -xzf "$archive" -C "$work/source"
          src=$(find "$work/source" -mindepth 1 -maxdepth 1 -type d -print -quit)
          echo "$src" > "$work/source-path"
          cd "$work/build"
          "$src/configure" FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Characterize matched one-pair solver on 10-site model
        run: |
          set -eu
          work="$RUNNER_TEMP/ed2-matched"
          src=$(cat "$work/source-path")
          python3 "$src/tests/mixed_spin_matched_benchmark.py" \
            --exe "$work/build/source/QS3ED2" --sizes 10 \
            --output "$work/results"
          python3 - "$work/results/report.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          print("MATCHED RESULTS:",report["run_count"],"runs;",
                report["accepted"],"accepted;",
                report["nonconverged"],"nonconverged;",
                len(report["contract_violations"]),"contract violations")
          for case in report["runs"]:
              print("SUMMARY",case["case"],"status",case["status"],"Hcalls",case["h_applications"],
                    "wall",case["wall_seconds"],"RSS",case["peak_rss_kib"],
                    "residual",case.get("residual"))
          if report["run_count"]!=16 or report["contract_violations"]:
              raise SystemExit("Matched solver benchmark assertions failed")
          PY
      - name: Save inputs, diagnostics and all numerical outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-matched-krylov-evidence
          path: ${{ runner.temp }}/ed2-matched/results/
          if-no-files-found: warn
          retention-days: 14
