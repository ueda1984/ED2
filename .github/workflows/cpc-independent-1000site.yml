name: CPC independent 1000-site two-magnon Gamma reference

on:
  push:
    branches:
      - codex/ed2-cpc-stationary-dm-scaling
    paths:
      - "tests/cpc_independent_1000site_two_magnon.py"
      - ".github/workflows/cpc-independent-1000site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-magnon-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent sparse numerical libraries
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2"
      - name: Reconstruct two-magnon Gamma Hamiltonian independently
        run: |
          python tests/cpc_independent_1000site_two_magnon.py \
            --report cpc-1000site-two-magnon-reference.json
      - name: Archive reference report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-independent-1000site-two-magnon
          path: cpc-1000site-two-magnon-reference.json
          retention-days: 30
          if-no-files-found: warn
