name: CPC near-degenerate physical low-doublet verification

on:
  push:
    branches:
      - codex/ed2-cpc-near-degenerate-physics
    paths:
      - ".github/workflows/cpc-near-degenerate.yml"
      - "tests/mixed_spin_*.py"
      - "tests/Makefile.am"
      - "source/**"
      - "configure.ac"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  degeneracy:
    name: "Near-degenerate physical chain (OMP=${{ matrix.threads }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        threads: [1, 2]
    env:
      FC: gfortran-13
      FCFLAGS: "-O2 -fopenmp"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Fortran toolchain and test-only NumPy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran-13 libopenblas-dev liblapack-dev autoconf automake make python3-numpy
      - name: Build only from an extracted source archive
        run: |
          set -eu
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          make dist
          work="$RUNNER_TEMP/ed2-degenerate"
          mkdir -p "$work/src" "$work/build"
          archive=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          tar -xzf "$archive" -C "$work/src"
          src=$(find "$work/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          printf '%s\n' "$src" > "$work/source-path"
          cd "$work/build"
          "$src/configure" FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Characterize near-degenerate/exact doublets with independent dense reference
        run: |
          set -eu
          work="$RUNNER_TEMP/ed2-degenerate"
          src=$(cat "$work/source-path")
          python3 "$src/tests/mixed_spin_near_degenerate.py" \
            --exe "$work/build/source/QS3ED2" \
            --omp "${{ matrix.threads }}" \
            --output "$work/results-omp${{ matrix.threads }}"
          python3 - "$work/results-omp${{ matrix.threads }}/report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print("SCIENCE SUMMARY: accepted",d["accepted"],
                "nonconverged",d["nonconverged"],
                "accepted observable mismatch",d["accepted_ground_magnetization_mismatch"],
                "harness violations",len(d["harness_violations"]))
          if d["tested"]!=32 or d["harness_violations"]:
              raise SystemExit("Near-degenerate characterization incomplete")
          PY
      - name: Independently verify an excited-state start with a strict residual policy
        run: |
          set -eu
          work="$RUNNER_TEMP/ed2-degenerate"
          src=$(cat "$work/source-path")
          python3 "$src/tests/mixed_spin_excited_start_probe.py" \
            --exe "$work/build/source/QS3ED2" \
            --omp "${{ matrix.threads }}" \
            --output "$work/excited-start-omp${{ matrix.threads }}"
          python3 - "$work/excited-start-omp${{ matrix.threads }}/report.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          r=x["result"]
          print("EXCITED-START OUTCOME:",r["outcome"],
                "witness=",r.get("explicit_excited_state_witness"),
                "residual=",r.get("direct_residuals"),
                "actual_energy_difference=",r.get("ground_energy_difference"))
          PY
      - name: Retain all inputs, outputs, eigenvectors and nonconvergence records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: near-degenerate-omp${{ matrix.threads }}
          path: ${{ runner.temp }}/ed2-degenerate/results-omp${{ matrix.threads }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain independent excited-start witness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excited-start-omp${{ matrix.threads }}
          path: ${{ runner.temp }}/ed2-degenerate/excited-start-omp${{ matrix.threads }}/
          if-no-files-found: warn
          retention-days: 14
