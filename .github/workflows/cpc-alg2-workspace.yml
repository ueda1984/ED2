name: CPC ALG2 restart workspace scan

on:
  push:
    branches:
      - codex/ed2-cpc-alg2-restart-sweep
    paths:
      - ".github/workflows/cpc-alg2-workspace.yml"
      - "tests/mixed_spin_*.py"
      - "tests/Makefile.am"
      - "source/**"
      - "configure.ac"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FC: gfortran-13
      FCFLAGS: "-O2 -fopenmp"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain and test-only sparse reference
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran-13 libopenblas-dev liblapack-dev autoconf automake make python3-numpy python3-scipy time
      - name: Build source release and recompile in clean build directory
        run: |
          set -eu
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          make dist
          work="$RUNNER_TEMP/ed2-alg2-workspace"
          mkdir -p "$work/src" "$work/build"
          archive=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          tar -xzf "$archive" -C "$work/src"
          src=$(find "$work/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          echo "$src" > "$work/source-path"
          cd "$work/build"
          "$src/configure" FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Evaluate ALG2 keep/capacity tradeoffs
        run: |
          set -eu
          work="$RUNNER_TEMP/ed2-alg2-workspace"
          src=$(cat "$work/source-path")
          python3 "$src/tests/mixed_spin_alg2_restart_sweep.py" \
            --exe "$work/build/source/QS3ED2" \
            --output "$work/results"
          python3 - "$work/results/report.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          print("RESTART SWEEP:",report["total_recorded"],"records,",
                report["converged"],"accepted,",
                report["nonconverged"],"nonconverged,",
                len(report["contract_violations"]),"contract violations")
          if report["total_recorded"]!=7 or report["contract_violations"]:
              raise SystemExit("Restart sweep invalid")
          PY
      - name: Preserve diagnostics and full scientific outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-alg2-workspace-sweep
          path: ${{ runner.temp }}/ed2-alg2-workspace/results/
          if-no-files-found: warn
          retention-days: 14
