      - "tests/cpc_cubic_basis_timing_regression.py"
      - "tests/cpc_cubic_fast_group_certificate_regression.py"
      - "tests/cpc_cubic_anchored_basis_regression.py"
      - "tests/cpc_cubic_basis_coordinate_cache_regression.py"
      - "tests/cpc_cubic_basis_coordinate_full_cache_regression.py"
      - "tests/cpc_cubic_basis_pruned_canonical_regression.py"
      - "tests/cpc_cubic_axis_pruning_oracle.py"
      - "tests/cpc_cubic_local_bond_cache_regression.py"
      - "tests/cpc_cubic_cache_phase_profile_regression.py"
      - "tests/cpc_cubic_direct_hop_table_regression.py"
      - "tests/cpc_cubic_skip_unused_hash_regression.py"
      - "tests/cubic_cache_driver.f90"
      - "tests/cubic_basis_driver.f90"
      - "tests/cpc_cubic_pointgroup_regression.py"
      - "tests/cpc_cubic_1000_one_magnon_smoke.py"
      - "tests/cpc_pointgroup_profile.py"
      - "tools/cpc_presto_cubic_benchmark.py"
      - "tools/cpc_presto_cubic_audit.py"
      - "tools/presto_cubic_exclusive.pbs"
      - ".github/workflows/cpc-cubic-oh-presto.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cubic-science-and-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gfortran-13, gfortran-14]
    env:
      FC: ${{ matrix.compiler }}
      FCFLAGS: -O2 -fopenmp
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install compiler, BLAS/LAPACK and independent NumPy reference
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ matrix.compiler }} libblas-dev liblapack-dev autoconf automake make time python3-numpy
      - name: Fail closed without a real PBS allocation
        run: |
          bash -n tools/presto_cubic_exclusive.pbs tools/presto_pointgroup_stage.sh
          if ED2_EXCLUSIVE_CONFIRMED=1 bash tools/presto_cubic_exclusive.pbs > "$RUNNER_TEMP/pbs-refusal.log" 2>&1; then
            echo "ERROR: cubic PBS script accepted an unallocated shared runner" >&2
            exit 1
          fi
          grep -q 'Required PBS/ED2 variable missing' "$RUNNER_TEMP/pbs-refusal.log"
      - name: Pin exact transferable reviewed source
        run: |
          bash tools/presto_pointgroup_stage.sh "$PWD" "$RUNNER_TEMP/staged-source"
          (cd "$RUNNER_TEMP/staged-source" && sha256sum -c ed2-source.sha256)
          test "$(cat "$RUNNER_TEMP/staged-source/source-commit.txt")" = "$(git rev-parse HEAD)"
      - name: Preflight Python 3.6 grammar and pre-3.8 math API
        run: |
          python3 - <<'PY'
          import ast
          import math
          from pathlib import Path
          import subprocess
          import sys

          files = [
              "tests/cpc_cubic_pointgroup.py",
              "tests/cpc_cubic_anchored_orbit_key_oracle.py",
              "tests/cpc_cubic_native_anchored_regression.py",
              "tests/cpc_cubic_basis_timing_regression.py",
              "tests/cpc_cubic_fast_group_certificate_regression.py",
              "tests/cpc_cubic_anchored_basis_regression.py",
              "tests/cpc_cubic_basis_coordinate_cache_regression.py",
              "tests/cpc_cubic_basis_coordinate_full_cache_regression.py",
              "tests/cpc_cubic_basis_pruned_canonical_regression.py",
              "tests/cpc_cubic_skip_unused_hash_regression.py",
              "tests/cpc_cubic_axis_pruning_oracle.py",
              "tests/cpc_cubic_local_bond_cache_regression.py",
              "tests/cpc_cubic_cache_phase_profile_regression.py",
              "tests/cpc_cubic_direct_hop_table_regression.py",
              "tests/cpc_cubic_pointgroup_regression.py",
              "tests/cpc_cubic_1000_one_magnon_smoke.py",
              "tests/cpc_pointgroup_profile.py",
              "tools/cpc_presto_cubic_benchmark.py",
              "tools/cpc_presto_cubic_audit.py",
          ]
          for path in files:
              ast.parse(Path(path).read_text(), filename=path, feature_version=(3, 6))
              print("PYTHON_3_6_GRAMMAR_PASS", path)
          sys.path.insert(0, str(Path('tests').resolve()))
          import cpc_cubic_pointgroup as cubic
          import cpc_pointgroup_profile as profile
          saved_comb = math.comb
          del math.comb
          try:
              assert cubic.choose3(0) == 0
              assert cubic.choose3(2) == 0
              assert cubic.choose3(1000) == 166167000
              assert profile.binomial(1000, 3) == 166167000
              assert cubic.sector_dimensions(4)['raw_dim'] == 41664
              assert cubic.sector_dimensions(10)['oh-a1g'] == 4299
          finally:
              math.comb = saved_comb
          print("PYTHON_PRE38_MATH_FALLBACK_PASS")
          PY
      - name: Build production ED2 and run baseline checks
        run: |
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          make check
      - name: Regression - benchmark-only anchored opt-in must not break legacy make check
        run: |
          # Reproduce PRESTO job 19602's failure: the native 100-site spin-chain
          # baseline is intentionally incompatible with the cubic-only fast path.
          if ED2_CUBIC_ANCHORED_REP=1 ED2_CUBIC_ANCHORED_VERIFY=1 \
              tests/test_ex1.sh > "$RUNNER_TEMP/leaked-anchored-ex1.log" 2>&1; then
            echo "ERROR: baseline test unexpectedly accepted cubic-only opt-in" >&2
            exit 1
          fi
          grep -q 'anchored: not a cubic volume' "$RUNNER_TEMP/leaked-anchored-ex1.log"
          # Match the build subshell in the PBS script: the environment is
          # restricted to a single child, never altered for the actual run.
          (
            export ED2_CUBIC_ANCHORED_REP=1 ED2_CUBIC_ANCHORED_VERIFY=1
            unset ED2_CUBIC_ANCHORED_REP ED2_CUBIC_ANCHORED_VERIFY
            tests/test_ex1.sh
          )
          python3 - <<'PY'
          from pathlib import Path
          script = Path('tools/presto_cubic_exclusive.pbs').read_text()
          guard = '  unset ED2_CUBIC_ANCHORED_REP ED2_CUBIC_ANCHORED_VERIFY'
          assert guard in script, 'Cubic opt-in isolation is missing'
          assert script.index('  cd -- "$run_dir/source"') < script.index(guard) < script.index('  autoreconf -vfi')
          assert 'python3 "$run_dir/source/tools/cpc_presto_cubic_benchmark.py"' in script
          print('PBS_CUBIC_ENV_ISOLATION_PASS')
          PY
      - name: Independent cubic Oh group, bond invariance and N1000 dimensions
        run: |
          python3 tests/cpc_cubic_pointgroup.py --sizes 4,6,8,10 --output "$RUNNER_TEMP/cubic-dim.json"
          python3 - "$RUNNER_TEMP/cubic-dim.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          a={x['sites']:x for x in d['results']}
          assert a[1000]['dimensions']=={'raw_dim':166167000,'gamma-t':166167,'oh-a1g':4299,'oh-a2g':3624,'oh-a1u':2884,'oh-a2u':3252}
          assert a[1000]['bond_count']==9000
          assert all(x['checked_bond_invariance'] for x in d['results'])
          print('CUBIC OH N64/216/512/1000 GROUP PASS')
          PY
      - name: Diagnose basis subphases without changing the scientific path
        run: |
          python3 tests/cpc_cubic_basis_timing_regression.py --exe "$PWD/source/QS3ED2" \
            --sides 4,6 --threads 1,4 --output "$RUNNER_TEMP/cubic-basis-breakdown"
      - name: Bit-for-bit normal-form certificate vs full legacy 48000-map validator
        run: |
          python3 tests/cpc_cubic_fast_group_certificate_regression.py --exe "$PWD/source/QS3ED2" \
            --sides 4,6 --threads 1,4 --output "$RUNNER_TEMP/cubic-group-certificate-small"
          python3 tests/cpc_cubic_fast_group_certificate_regression.py --exe "$PWD/source/QS3ED2" \
            --sides 10 --threads 1 --sectors oh-a1g \
            --output "$RUNNER_TEMP/cubic-group-certificate-n1000"
      - name: Fast cubic group certificate must reject an unrelated chain
        run: |
          if ED2_CUBIC_FAST_GROUP_VALIDATION=1 tests/test_ex1.sh \
            > "$RUNNER_TEMP/cubic-certificate-reject-chain.log" 2>&1; then
            echo "ERROR: noncubic chain accepted cubic group certificate" >&2
            exit 1
          fi
          grep -q 'Fast cubic group certificate requires noncommuting full O_h' \
            "$RUNNER_TEMP/cubic-certificate-reject-chain.log"
          if ED2_CUBIC_FAST_GROUP_VALIDATION=1 python3 tools/cpc_presto_cubic_benchmark.py \
            --source-revision "$(git rev-parse HEAD)" \
            --source-archive "$RUNNER_TEMP/staged-source/ed2-source.tar.gz" \
            --preset cubic-smoke --allow-shared --sizes 4 --sectors gamma-t --plan-only \
            --output "$RUNNER_TEMP/should-not-exist-group" > "$RUNNER_TEMP/group-refusal.log" 2>&1; then
            echo "ERROR: translation-only sector accepted cubic group certificate" >&2
            exit 1
          fi
          grep -q 'Fast cubic group certificate requires a noncommuting 1D O_h sector' \
            "$RUNNER_TEMP/group-refusal.log"
      - name: Exact anchored cubic basis and normalizations versus old 166-million-state enumerator
        run: |
          python3 tests/cpc_cubic_anchored_basis_regression.py \
            --driver "$PWD/tests/cubic_basis_driver" --exe "$PWD/source/QS3ED2" \
            --sides 4,6 --threads 1,4 --output "$RUNNER_TEMP/cubic-anchored-basis-small"
          python3 tests/cpc_cubic_anchored_basis_regression.py \
            --driver "$PWD/tests/cubic_basis_driver" --exe "$PWD/source/QS3ED2" \
            --sides 8,10 --threads 1 --skip-lanczos \
            --output "$RUNNER_TEMP/cubic-anchored-basis-large"
          python3 tests/cpc_cubic_anchored_basis_regression.py \
            --driver "$PWD/tests/cubic_basis_driver" --exe "$PWD/source/QS3ED2" \
            --sides 10 --threads 4,8 --sectors oh-a1g --skip-lanczos \
            --output "$RUNNER_TEMP/cubic-anchored-basis-parallel"
      - name: Exact coordinate-cache basis bits across all irreps and volumes
        run: |
          python3 tests/cpc_cubic_basis_coordinate_cache_regression.py \
            --driver "$PWD/tests/cubic_basis_driver" --sides 4,6,8,10 \
            --threads 1,4 --output "$RUNNER_TEMP/cubic-basis-coordinate-cache"
          python3 tests/cpc_cubic_basis_coordinate_cache_regression.py \
            --driver "$PWD/tests/cubic_basis_driver" --sides 10 \
            --threads 8 --output "$RUNNER_TEMP/cubic-basis-coordinate-cache-t8"
      - name: Coordinate cache must preserve complete native Hamiltonian cache bits and Ritz physics
        run: |
          python3 tests/cpc_cubic_basis_coordinate_full_cache_regression.py \
            --driver "$PWD/tests/cubic_cache_driver" --exe "$PWD/source/QS3ED2" \
            --sides 4,6 --threads 1,4 \
            --output "$RUNNER_TEMP/cubic-coordinate-fullcache-small"
          python3 tests/cpc_cubic_basis_coordinate_full_cache_regression.py \
            --driver "$PWD/tests/cubic_cache_driver" --exe "$PWD/source/QS3ED2" \
            --sides 10 --threads 1,4,8 --skip-lanczos \
            --output "$RUNNER_TEMP/cubic-coordinate-fullcache-n1000"
      - name: Independent exhaustive and sampled integer oracle for pruned canonical translations
        run: |
          python3 tests/cpc_cubic_axis_pruning_oracle.py \
            --random-per-side 6000
      - name: Axis-pruned canonical enumeration must preserve full basis, Hamiltonian and Ritz bits
        run: |
          python3 tests/cpc_cubic_basis_pruned_canonical_regression.py \
            --basis-driver "$PWD/tests/cubic_basis_driver" \
            --cache-driver "$PWD/tests/cubic_cache_driver" \
            --exe "$PWD/source/QS3ED2" \
            --sides 4,6,8,10 --threads 1,4 \
            --output "$RUNNER_TEMP/cubic-pruned-canonical-main"
          python3 tests/cpc_cubic_basis_pruned_canonical_regression.py \
            --basis-driver "$PWD/tests/cubic_basis_driver" \
            --cache-driver "$PWD/tests/cubic_cache_driver" \
            --exe "$PWD/source/QS3ED2" \
            --sides 10 --threads 8 --skip-lanczos \
            --output "$RUNNER_TEMP/cubic-pruned-canonical-t8"
      - name: PRESTO provenance smoke with coordinate optimization and forced-legacy control
        run: |
          ED2_CUBIC_ANCHORED_REP=1 ED2_CUBIC_FAST_GROUP_VALIDATION=1 \
          ED2_CUBIC_ANCHORED_BASIS=1 ED2_CUBIC_LOCAL_BOND_CACHE=1 \
          ED2_CUBIC_DIRECT_HOP_TABLE=1 ED2_CUBIC_BASIS_COORD_CACHE=1 \
            python3 tools/cpc_presto_cubic_benchmark.py \
              --exe "$PWD/source/QS3ED2" \
              --output "$RUNNER_TEMP/cubic-coordinate-benchmark" \
              --source-revision "$(git rev-parse HEAD)" \
              --source-archive "$RUNNER_TEMP/staged-source/ed2-source.tar.gz" \
              --preset cubic-pilot --allow-shared --sizes 4 \
              --sectors oh-a1g --threads 1 --warmups 0 --repeats 1 --mnte 64
          python3 tools/cpc_presto_cubic_audit.py \
            --root "$RUNNER_TEMP/cubic-coordinate-benchmark" \
            --output "$RUNNER_TEMP/audit-coordinate-benchmark" \
            --source-archive "$RUNNER_TEMP/staged-source/ed2-source.tar.gz" \
            --exe "$PWD/source/QS3ED2"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'cubic-coordinate-benchmark'
          summary=json.loads((root/'summary.json').read_text())
          assert summary['basis_coord_cache'] is True
          assert summary['direct_hop_table'] is True
          records=[json.loads(l) for l in (root/'trials.jsonl').read_text().splitlines()]
          assert len(records)==2 and all(r['basis_coord_cache'] for r in records)
          native=dict((r['builder'],(root/'trials'/r['key']/'stdout.log').read_text()) for r in records)
          marker='Basis orbit coordinates: exact precomputed periodic deltas'
          assert marker in native['fast'] and marker not in native['forced-legacy']
          print('CUBIC_COORD_PRESTO_PROVENANCE_PASS')
          PY
          if ED2_CUBIC_BASIS_COORD_CACHE=1 python3 tools/cpc_presto_cubic_benchmark.py \
              --source-revision "$(git rev-parse HEAD)" \
              --source-archive "$RUNNER_TEMP/staged-source/ed2-source.tar.gz" \
              --preset cubic-smoke --allow-shared --sizes 4 --sectors oh-a1g \
              --plan-only --output "$RUNNER_TEMP/cubic-coordinate-invalid" \
              > "$RUNNER_TEMP/cubic-coordinate-invalid.log" 2>&1; then
            echo "ERROR: coordinate cache requested without anchored basis" >&2
            exit 1
          fi
          grep -q 'Basis coordinate cache requires ED2_CUBIC_ANCHORED_BASIS=1' \
            "$RUNNER_TEMP/cubic-coordinate-invalid.log"
      - name: PRESTO-pruned native opt-in provenance, forced-legacy isolation and independent audit
        run: |
          ED2_CUBIC_ANCHORED_REP=1 ED2_CUBIC_FAST_GROUP_VALIDATION=1 \
          ED2_CUBIC_ANCHORED_BASIS=1 ED2_CUBIC_LOCAL_BOND_CACHE=1 \
          ED2_CUBIC_DIRECT_HOP_TABLE=1 ED2_CUBIC_BASIS_COORD_CACHE=1 \
          ED2_CUBIC_BASIS_PRUNED_CANON=1 \
            python3 tools/cpc_presto_cubic_benchmark.py \
              --exe "$PWD/source/QS3ED2" \
              --output "$RUNNER_TEMP/cubic-pruned-benchmark" \
              --source-revision "$(git rev-parse HEAD)" \
              --source-archive "$RUNNER_TEMP/staged-source/ed2-source.tar.gz" \
              --preset cubic-pilot --allow-shared --sizes 4 \
              --sectors oh-a1g --threads 1 --warmups 0 --repeats 1 --mnte 64
          python3 tools/cpc_presto_cubic_audit.py \
            --root "$RUNNER_TEMP/cubic-pruned-benchmark" \
            --output "$RUNNER_TEMP/audit-pruned-benchmark" \
            --source-archive "$RUNNER_TEMP/staged-source/ed2-source.tar.gz" \
            --exe "$PWD/source/QS3ED2"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'cubic-pruned-benchmark'
          s=json.loads((root/'summary.json').read_text())
          assert s['basis_coord_cache'] is True and s['basis_pruned_canon'] is True
          data=[json.loads(x) for x in (root/'trials.jsonl').read_text().splitlines()]
          assert len(data)==2
          assert all(x['basis_pruned_canon'] and x['basis_coord_cache'] for x in data)
          labels={}
          for r in data:
              raw=(root/'trials'/r['key']/'stdout.log').read_text()
              labels[r['builder']]='Basis canonical enumeration: exact-axis-pruned' in raw
          assert labels=={'fast':True,'forced-legacy':False}
          print('CUBIC_PRUNED_CANON_PRESTO_PROVENANCE_PASS')
          PY
          if ED2_CUBIC_BASIS_PRUNED_CANON=1 python3 tools/cpc_presto_cubic_benchmark.py \
              --source-revision "$(git rev-parse HEAD)" \
              --source-archive "$RUNNER_TEMP/staged-source/ed2-source.tar.gz" \
              --preset cubic-smoke --allow-shared --sizes 4 --sectors oh-a1g \
              --plan-only --output "$RUNNER_TEMP/cubic-pruned-invalid" \
              > "$RUNNER_TEMP/cubic-pruned-invalid.log" 2>&1; then
            echo "ERROR: pruned canonicalization accepted missing coordinate-cache guard" >&2
            exit 1
          fi
          grep -q 'Pruned canonical basis requires ED2_CUBIC_BASIS_COORD_CACHE=1' \
            "$RUNNER_TEMP/cubic-pruned-invalid.log"
      - name: Native PRESTO-like unused-hash provenance, legacy isolation and separate audit
        run: |
          ED2_CUBIC_ANCHORED_REP=1 ED2_CUBIC_FAST_GROUP_VALIDATION=1 \
          ED2_CUBIC_ANCHORED_BASIS=1 ED2_CUBIC_LOCAL_BOND_CACHE=1 \
          ED2_CUBIC_DIRECT_HOP_TABLE=1 ED2_CUBIC_BASIS_COORD_CACHE=1 \
          ED2_CUBIC_BASIS_PRUNED_CANON=1 ED2_CUBIC_SKIP_UNUSED_HASH=1 \
            python3 tools/cpc_presto_cubic_benchmark.py \
              --exe "$PWD/source/QS3ED2" \
              --output "$RUNNER_TEMP/cubic-skip-hash-benchmark" \
              --source-revision "$(git rev-parse HEAD)" \
              --source-archive "$RUNNER_TEMP/staged-source/ed2-source.tar.gz" \
              --preset cubic-pilot --allow-shared --sizes 4 \
              --sectors oh-a1g --threads 1 --warmups 0 --repeats 1 --mnte 64
          python3 tools/cpc_presto_cubic_audit.py \
            --root "$RUNNER_TEMP/cubic-skip-hash-benchmark" \
            --output "$RUNNER_TEMP/audit-skip-hash-benchmark" \
            --source-archive "$RUNNER_TEMP/staged-source/ed2-source.tar.gz" \
            --exe "$PWD/source/QS3ED2"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'cubic-skip-hash-benchmark'
          data=json.loads((root/'summary.json').read_text())
          assert data['basis_coord_cache'] is True
          assert data['basis_pruned_canon'] is True
          assert data['direct_hop_table'] is True
          assert data['skip_unused_hash'] is True
          records=[json.loads(x) for x in (root/'trials.jsonl').read_text().splitlines()]
          assert len(records)==2 and all(r['skip_unused_hash'] for r in records)
          for rec in records:
              native=(root/'trials'/rec['key']/'stdout.log').read_text(errors='replace')
              expected=(rec['builder']=='fast')
              assert ('Representative lookup: cubic-direct-only-unused-hash-elided' in native) is expected
          print('CUBIC_SKIP_HASH_PRESTO_PROVENANCE_PASS')
          PY
          if ED2_CUBIC_SKIP_UNUSED_HASH=1 python3 tools/cpc_presto_cubic_benchmark.py \
              --source-revision "$(git rev-parse HEAD)" \
              --source-archive "$RUNNER_TEMP/staged-source/ed2-source.tar.gz" \
              --preset cubic-smoke --allow-shared --sizes 4 --sectors oh-a1g \
              --plan-only --output "$RUNNER_TEMP/cubic-skip-hash-invalid" \
              > "$RUNNER_TEMP/cubic-skip-hash-invalid.log" 2>&1; then
            echo "ERROR: unused hash bypass without direct hop accepted" >&2
            exit 1
          fi
          grep -q 'Skipping unused orbit hash requires ED2_CUBIC_DIRECT_HOP_TABLE=1' \
            "$RUNNER_TEMP/cubic-skip-hash-invalid.log"
      - name: Anchored cubic basis must fail closed on mismatched source geometry and symmetry
        run: |
          if ED2_CUBIC_ANCHORED_BASIS=1 ED2_CUBIC_FAST_GROUP_VALIDATION=1 \
              tests/test_ex1.sh > "$RUNNER_TEMP/reject-basis-chain.log" 2>&1; then
            echo "ERROR: anchored cubic basis accepted general spin chain" >&2
            exit 1
          fi
          grep -q 'Anchored cubic basis requires exactly three down spins' \
            "$RUNNER_TEMP/reject-basis-chain.log"
          if ED2_CUBIC_ANCHORED_BASIS=1 ED2_CUBIC_FAST_GROUP_VALIDATION=1 \
              python3 tools/cpc_presto_cubic_benchmark.py \
                --source-revision "$(git rev-parse HEAD)" \
                --source-archive "$RUNNER_TEMP/staged-source/ed2-source.tar.gz" \
                --preset cubic-smoke --allow-shared --sizes 4 --sectors gamma-t --plan-only \
                --output "$RUNNER_TEMP/anchored-basis-invalid" > "$RUNNER_TEMP/anchored-basis-invalid.log" 2>&1; then
            echo "ERROR: anchored cubic basis accepted translation-only symmetry" >&2
            exit 1
          fi
          grep -q 'Anchored cubic basis requires a 1D O_h sector' "$RUNNER_TEMP/anchored-basis-invalid.log"
      - name: Every local sparse cubic Hamiltonian offdiagonal equals original cache bit-for-bit
        run: |
          python3 tests/cpc_cubic_local_bond_cache_regression.py \
            --driver "$PWD/tests/cubic_cache_driver" --exe "$PWD/source/QS3ED2" \
            --sides 4,6 --threads 1,4 --output "$RUNNER_TEMP/cubic-local-cache-small"
          python3 tests/cpc_cubic_local_bond_cache_regression.py \
            --driver "$PWD/tests/cubic_cache_driver" --exe "$PWD/source/QS3ED2" \
            --sides 10 --threads 1 --skip-lanczos \
            --output "$RUNNER_TEMP/cubic-local-cache-n1000"
      - name: Optional cache subphase probes leave every Hamiltonian cache bit unchanged
        run: |
          python3 tests/cpc_cubic_cache_phase_profile_regression.py \
            --driver "$PWD/tests/cubic_cache_driver" \
            --sides 4,10 --threads 1,4 --sectors oh-a1g \
            --output "$RUNNER_TEMP/cubic-cache-profiler-proof"
          if ED2_CUBIC_CACHE_PROFILE=1 python3 tools/cpc_presto_cubic_benchmark.py \
              --source-revision "$(git rev-parse HEAD)" \
              --source-archive "$RUNNER_TEMP/staged-source/ed2-source.tar.gz" \
              --preset cubic-smoke --allow-shared --sizes 4 --sectors oh-a1g \
              --plan-only --output "$RUNNER_TEMP/reject-profiler-plan" \
              > "$RUNNER_TEMP/reject-profiler-plan.log" 2>&1; then
            echo "ERROR: profiler allowed without local cache guard" >&2
            exit 1
          fi
          grep -q 'Cache profiling requires ED2_CUBIC_LOCAL_BOND_CACHE=1' \
            "$RUNNER_TEMP/reject-profiler-plan.log"
      - name: Dense cubic direct-hop table must preserve every complex Hamiltonian cache bit
        run: |
          python3 tests/cpc_cubic_direct_hop_table_regression.py \
            --driver "$PWD/tests/cubic_cache_driver" --exe "$PWD/source/QS3ED2" \
            --sides 4,6 --threads 1,4 \
            --output "$RUNNER_TEMP/cubic-direct-hop-small"
          python3 tests/cpc_cubic_direct_hop_table_regression.py \
            --driver "$PWD/tests/cubic_cache_driver" --exe "$PWD/source/QS3ED2" \
            --sides 10 --threads 1,4,8 --skip-lanczos \
            --output "$RUNNER_TEMP/cubic-direct-hop-n1000"
          if ED2_CUBIC_DIRECT_HOP_TABLE=1 python3 tools/cpc_presto_cubic_benchmark.py \
            --source-revision "$(git rev-parse HEAD)" \
            --source-archive "$RUNNER_TEMP/staged-source/ed2-source.tar.gz" \
            --preset cubic-smoke --allow-shared --sizes 4 --sectors oh-a1g \
            --plan-only --output "$RUNNER_TEMP/reject-direct-hop-plan" \
            > "$RUNNER_TEMP/reject-direct-hop-plan.log" 2>&1; then
            echo "ERROR: unguarded dense direct hop plan" >&2
            exit 1
          fi
          grep -q 'Direct cubic hop table requires all four previous cubic opt-ins' \
            "$RUNNER_TEMP/reject-direct-hop-plan.log"
      - name: Direct-hop mode must preserve full native H cache bits without unused hash table
        run: |
          python3 tests/cpc_cubic_skip_unused_hash_regression.py \
            --driver "$PWD/tests/cubic_cache_driver" \
            --exe "$PWD/source/QS3ED2" \
            --sides 4,6,10 --threads 1,4 \
            --output "$RUNNER_TEMP/cubic-elide-unused-hash-t1t4"
          python3 tests/cpc_cubic_skip_unused_hash_regression.py \
            --driver "$PWD/tests/cubic_cache_driver" \
            --exe "$PWD/source/QS3ED2" \
            --sides 10 --threads 8 --skip-lanczos \
            --output "$RUNNER_TEMP/cubic-elide-unused-hash-t8"
      - name: Local cubic cache must reject general chains and incompatible non-XXZ bonds
        run: |
          if ED2_CUBIC_LOCAL_BOND_CACHE=1 tests/test_ex1.sh \
            > "$RUNNER_TEMP/reject-local-cache-chain.log" 2>&1; then
            echo "ERROR: general spin chain accepted local cubic cache" >&2
            exit 1
          fi
          # Automatic MNTE validates the fixed-three-magnon preconditions
          # before entering the local sparse cache builder.  Both rejection
          # messages are safe; a generic chain must never accept this path.
          grep -qF 'Auto cubic MNTE requires fixed three-magnon U(1) sector' \
            "$RUNNER_TEMP/reject-local-cache-chain.log"
          python3 - <<'PY'
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tests')
          import cpc_cubic_pointgroup as oracle
          with tempfile.TemporaryDirectory() as folder:
              work=Path(folder)/'bad-xxz'
              sector='oh-a1g'
              oracle.write_input(work,4,3,oracle.symmetry_generators(4,sector),
                                 oracle.canonical_bonds(4),mnte=64)
              bond_file=work/'bonds.dat'
              rows=bond_file.read_text().splitlines()
              entry=rows[0].split()
              entry[3]='0.999'
              rows[0]=' '.join(entry)
              bond_file.write_text('\n'.join(rows)+'\n')
              env=dict(os.environ, ED2_CUBIC_ANCHORED_REP='1',
                       ED2_CUBIC_FAST_GROUP_VALIDATION='1',
                       ED2_CUBIC_ANCHORED_BASIS='1',
                       ED2_CUBIC_LOCAL_BOND_CACHE='1',
                       OPENBLAS_NUM_THREADS='1', OMP_NUM_THREADS='1')
              with (work/'input.dat').open('rb') as inp:
                  cp=subprocess.run([str(Path('tests/cubic_cache_driver').resolve())],
                                    stdin=inp,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
                                    cwd=work,env=env,check=False)
              assert cp.returncode!=0
              assert b'anchored: requires conserving real XXZ' in cp.stdout or \
                     b'Local cubic cache requires exactly real XXZ bonds' in cp.stdout
          print('CUBIC_LOCAL_BOND_CACHE_REJECTION_PASS')
          PY
      - name: Exhaustive anchored-key orbit census and O_h character equivariance
        run: |
          python3 tests/cpc_cubic_anchored_orbit_key_oracle.py --side 4 --samples 250
      - name: Native 1000-site one-magnon Oh geometry and direct residual smoke
        run: |
          python3 tests/cpc_cubic_1000_one_magnon_smoke.py --exe "$PWD/source/QS3ED2" --output "$RUNNER_TEMP/cubic-1000-n1"
      - name: Independent physical projected Hamiltonians for all Oh 1D irreps
        run: |
          python3 tests/cpc_cubic_pointgroup_regression.py --exe "$PWD/source/QS3ED2" --output "$RUNNER_TEMP/cubic-physics" --threads 1
      - name: Native anchored representatives, compare every cache hop to the original ID/character
        run: |
          python3 tests/cpc_cubic_native_anchored_regression.py --exe "$PWD/source/QS3ED2" \
            --sizes 4,6 --threads 1 --verify-hops --output "$RUNNER_TEMP/cubic-anchored-hops"
          python3 tests/cpc_cubic_native_anchored_regression.py --exe "$PWD/source/QS3ED2" \
            --sizes 4,6 --threads 4 --output "$RUNNER_TEMP/cubic-anchored-omp4"
      - name: Native anchored lookup under the historical orbit-basis fallback
        run: |
