            ${{ runner.temp }}/cubic-anchored-legacy-basis/
            ${{ runner.temp }}/cubic-basis-breakdown/
            ${{ runner.temp }}/cubic-group-certificate-small/
            ${{ runner.temp }}/cubic-group-certificate-n1000/
