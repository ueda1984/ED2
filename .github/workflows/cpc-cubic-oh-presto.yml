name: ED2 cubic Oh symmetry and PRESTO protocol

on:
  push:
    branches: [codex/ed2-cpc-cubic-oh-1000-presto, codex/ed2-cubic-cache-mnte-cap-experiment, codex/ed2-cubic-anchored-key-oracle, codex/ed2-cubic-native-anchored-representatives, codex/ed2-cubic-basis-phase-instrumentation, codex/ed2-cubic-fast-oh-group-certificate, codex/ed2-cubic-anchored-basis-builder, codex/ed2-cubic-local-bond-cache, codex/ed2-cubic-cache-phase-profile, codex/ed2-cubic-direct-hop-table, codex/ed2-cubic-basis-coordinate-cache, codex/ed2-cubic-basis-pruned-canonical, codex/ed2-cubic-direct-hop-elide-unused-hash]
    paths:
      - "source/state_lists.f90"
      - "source/cubic_anchored_lookup.f90"
      - "source/ham2vec.f90"
      - "source/Makefile.am"
      - "tests/Makefile.am"
      - "docs/development/cpc-cubic-oh-1000-presto-20261118.md"
      - "docs/development/cpc-cubic-cache-mnte-study-20261118.md"
      - "docs/development/cpc-cubic-native-anchored-lookup-20261118.md"
      - "docs/development/cpc-cubic-basis-bottleneck-timing-20261118.md"
      - "docs/development/cpc-cubic-fast-group-certificate-20261118.md"
