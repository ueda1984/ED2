      - "docs/development/cpc-cubic-basis-bottleneck-timing-20261118.md"
      - "docs/development/cpc-cubic-fast-group-certificate-20261118.md"
      - "docs/development/cpc-cubic-anchored-basis-20261118.md"
      - "docs/development/cpc-cubic-local-bond-cache-20261118.md"
      - "docs/development/cpc-cubic-cache-profiler-20261118.md"
      - "docs/development/cpc-cubic-direct-hop-table-20261118.md"
      - "docs/development/cpc-cubic-basis-coordinate-cache-20261118.md"
      - "docs/development/cpc-cubic-basis-pruned-canonical-20261119.md"
