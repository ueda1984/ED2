name: CPC stationary DM two-eigenpair restart study

on:
  push:
    branches:
      - codex/ed2-cpc-stationary-dm-scaling
    paths:
      - ".github/workflows/cpc-stationary-multipair.yml"
      - "tests/cpc_stationary_multipair_benchmark.py"
      - "tests/mixed_spin_dm_chirality_scan.py"
      - "tests/mixed_spin_matched_benchmark.py"
      - "tests/cpc_stationary_resource_benchmark.py"
      - "tests/Makefile.am"
      - "source/**"
      - "configure.ac"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-eigenpair:
    name: "Two-eigenpair ${{ matrix.tag }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: "small-omp1", threads: 1, sizes: "8,10", D_values: "0,0.12", workspaces: "2:16,4:24", repeats: 2}
          - {tag: "small-omp2", threads: 2, sizes: "8,10", D_values: "0,0.12", workspaces: "2:16,4:24", repeats: 2}
          - {tag: "large-omp1", threads: 1, sizes: "12", D_values: "0.12", workspaces: "2:16,4:24", repeats: 1}
          - {tag: "large-omp2", threads: 2, sizes: "12", D_values: "0.12", workspaces: "2:16,4:24", repeats: 1}
    env:
      FC: gfortran-13
      FCFLAGS: "-O2 -fopenmp"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and independent SciPy reference
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran-13 libopenblas-dev liblapack-dev autoconf automake make python3-numpy python3-scipy time
      - name: Build from separately unpacked source distribution
        run: |
          set -eu
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          make dist
          tmp="$RUNNER_TEMP/ed2-multipair"
          mkdir -p "$tmp/src" "$tmp/build"
          tgz=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$tgz"
          tar -xzf "$tgz" -C "$tmp/src"
          src=$(find "$tmp/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$src/tests/cpc_stationary_multipair_benchmark.py"
          printf '%s\n' "$src" > "$tmp/source-path"
          cd "$tmp/build"
          "$src/configure" FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Independently validate two lowest eigenpairs and ground observables
        run: |
          set -eu
          tmp="$RUNNER_TEMP/ed2-multipair"
          src=$(cat "$tmp/source-path")
          python3 "$src/tests/cpc_stationary_multipair_benchmark.py" \
            --exe "$tmp/build/source/QS3ED2" \
            --sizes "${{ matrix.sizes }}" \
            --D-values "${{ matrix.D_values }}" \
            --workspaces "${{ matrix.workspaces }}" \
            --omp "${{ matrix.threads }}" \
            --repeats "${{ matrix.repeats }}" \
            --output "$RUNNER_TEMP/cpc-multipair-${{ matrix.tag }}"
          python3 - "$RUNNER_TEMP/cpc-multipair-${{ matrix.tag }}/report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["pass_complete"],(d["nonconverged"],d["contract_violations"])
          assert d["expected"]==d["completed"]==d["accepted"]
          assert all(x["successful_measurements"]==x["target"] for x in d["summary"])
          print("STATIONARY TWO-EIGENPAIR CONTRACT",d["completed"],"/",d["expected"])
          PY
      - name: Archive full case directories and independent reference report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-multipair-${{ matrix.tag }}
          path: ${{ runner.temp }}/cpc-multipair-${{ matrix.tag }}/
          if-no-files-found: warn
          retention-days: 21
