name: CPC stationary two-site DM/chirality susceptibility

on:
  push:
    branches:
      - codex/ed2-cpc-stationary-dm-scaling
    paths:
      - ".github/workflows/cpc-stationary-dm.yml"
      - "tests/mixed_spin_dm_chirality_scan.py"
      - "tests/plot_cpc_dm_chirality.py"
      - "tests/Makefile.am"
      - "source/**"
      - "configure.ac"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chirality-physics:
    name: "Stationary DM chirality: ${{ matrix.tag }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {threads: 1, sizes: "4,6,8,10", tag: "small-omp1"}
          - {threads: 2, sizes: "4,6,8,10", tag: "small-omp2"}
          - {threads: 1, sizes: "12", tag: "large-omp1"}
          - {threads: 2, sizes: "12", tag: "large-omp2"}
    env:
      FC: gfortran-13
      FCFLAGS: "-O2 -fopenmp"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
    steps:
      - name: Checkout development sources
        uses: actions/checkout@v4
      - name: Install compiler and independent NumPy/SciPy references
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran-13 libopenblas-dev liblapack-dev autoconf automake make python3-numpy python3-scipy time
      - name: Build from a separately extracted source archive
        run: |
          set -eu
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          make dist
          work="$RUNNER_TEMP/ed2-chirality"
          mkdir -p "$work/src" "$work/build"
          tgz=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$tgz"
          tar -xzf "$tgz" -C "$work/src"
          src=$(find "$work/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$src/tests/mixed_spin_dm_chirality_scan.py"
          printf '%s\n' "$src" > "$work/source-path"
          cd "$work/build"
          "$src/configure" FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
          python3 -c "import numpy,scipy; print('numpy',numpy.__version__,'scipy',scipy.__version__)"
      - name: Independently verify low spectrum, chirality, NN correlations and dE/dD
        run: |
          set -eu
          work="$RUNNER_TEMP/ed2-chirality"
          src=$(cat "$work/source-path")
          python3 "$src/tests/mixed_spin_dm_chirality_scan.py" \
            --profile stationary \
            --exe "$work/build/source/QS3ED2" \
            --omp "${{ matrix.threads }}" \
            --sizes "${{ matrix.sizes }}" \
            --output "$work/results-${{ matrix.tag }}"
          python3 - "$work/results-${{ matrix.tag }}/report.json" "${{ matrix.sizes }}" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          expected=len(sys.argv[2].split(","))*6
          print("DM PHYSICS REPORT: observed",d["completed"],"expected",expected,
                "success",d["successful"],"nonconverged",d["numerical_nonconvergence"],
                "violations",len(d["contract_violations"]))
          if not (d["completed"]==expected==d["successful"] and
                  d["numerical_nonconvergence"]==0 and not d["contract_violations"]):
              raise SystemExit("Independent DM/chirality scientific validation failed")
          if d["profile"]!="stationary":
              raise SystemExit("Incorrect physical model profile")
          derivatives=[x for x in d["independent_physics"] if x["D"]==0]
          if len(derivatives)!=len(sys.argv[2].split(",")) or any(
              x["hf_error"] is None or x["hf_error"]>3e-5 or
              x["chi_selfconsistency_error"] is None or
              x["chi_selfconsistency_error"]>2e-4 or
              x["chi_from_kappa_per_bond"]<0
              for x in derivatives):
              raise SystemExit("DM Hellmann-Feynman/concavity/response consistency failed")
          PY
      - name: Preserve model inputs, full numerical provenance and CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stationary-dm-chirality-${{ matrix.tag }}
          path: ${{ runner.temp }}/ed2-chirality/results-${{ matrix.tag }}/
          if-no-files-found: warn
          retention-days: 21

  figure-ready-plots:
    name: CPC finite-chain DM figures
    needs: chirality-physics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout same verified source
        uses: actions/checkout@v4
      - name: Install headless Matplotlib for optional figures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-matplotlib python3-numpy
      - name: Generate and validate three separate physical figures
        run: |
          set -eu
          python3 tests/plot_cpc_dm_chirality.py \
            --csv docs/development/cpc-stationary-dm-reference.csv \
            --outdir "$RUNNER_TEMP/cpc-dm-figures"
          test "$(find "$RUNNER_TEMP/cpc-dm-figures" -maxdepth 1 -name '*.svg' | wc -l)" -eq 3
          test "$(find "$RUNNER_TEMP/cpc-dm-figures" -maxdepth 1 -name '*.png' | wc -l)" -eq 3
      - name: Retain figure-ready SVG and PNG assets
        uses: actions/upload-artifact@v4
        with:
          name: cpc-stationary-dm-figure-prototypes
          path: ${{ runner.temp }}/cpc-dm-figures/
          if-no-files-found: error
          retention-days: 21
