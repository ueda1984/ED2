name: Documentation validation

on:
  push:
    branches:
      - codex/ed2-docs-cpc-preparation
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs-validation.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs-validation.yml"

permissions:
  contents: read

jobs:
  mkdocs:
    name: Build MkDocs in strict mode
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Validate website and links
        run: python -m mkdocs build --strict
