name: CPC 8-site stationary-core sparse doublet trace

on:
  push:
    branches:
      - codex/ed2-cpc-stationary-dm-scaling
    paths:
      - ".github/workflows/cpc-stationary-sparse-doublet.yml"
      - "tests/cpc_stationary_low_doublet_trace.py"
      - "tests/mixed_spin_near_degenerate.py"
      - "tests/mixed_spin_dm_chirality_scan.py"
      - "tests/mixed_spin_sparse_scale.py"
      - "tests/mixed_spin_doublet_trace.py"
      - "tests/Makefile.am"
      - "source/**"
      - "configure.ac"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparse-doublet:
    name: "Sparse low-doublet trace OMP=${{ matrix.omp }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        omp: [1, 2]
    env:
      FC: gfortran-13
      FCFLAGS: "-O2 -fopenmp"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: Install fresh build tools and independent SciPy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran-13 libopenblas-dev liblapack-dev autoconf automake make python3-numpy python3-scipy time
      - name: Build solely from extracted source archive
        run: |
          set -eu
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          make dist
          root="$RUNNER_TEMP/ed2-eight-site-doublet"
          mkdir -p "$root/src" "$root/build"
          tarball=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$tarball"
          tar -xzf "$tarball" -C "$root/src"
          src=$(find "$root/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$src/tests/cpc_stationary_low_doublet_trace.py"
          printf '%s\n' "$src" > "$root/source-path"
          cd "$root/build"
          "$src/configure" FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          "$FC" --version | head -n 1
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Verify doublet projectors and native ED2 I/O
        run: |
          set -eu
          root="$RUNNER_TEMP/ed2-eight-site-doublet"
          src=$(cat "$root/source-path")
          python3 "$src/tests/cpc_stationary_low_doublet_trace.py" \
            --exe "$root/build/source/QS3ED2" --omp "${{ matrix.omp }}" \
            --sizes 8 --deltas 0,1e-10,1e-6 \
            --workspaces 2:16,4:24 \
            --output "$RUNNER_TEMP/cpc-sparse-doublet-omp${{ matrix.omp }}"
          python3 - "$RUNNER_TEMP/cpc-sparse-doublet-omp${{ matrix.omp }}/report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d["pass_complete"],d["failures"]
          assert d["expected"]==d["passed"]==6
          assert all(x["max_direct_residual"]<=1e-8*(1+1e-12) for x in d["results"])
          assert all(x["independent_trace_corr_max_error"]<=2e-5 for x in d["results"])
          print("8-SITE SPARSE LOW DOUBLET VERIFIED",d["passed"],"/",d["expected"])
          PY
      - name: Preserve native wavefunctions and independent reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-sparse-doublet-omp${{ matrix.omp }}
          path: ${{ runner.temp }}/cpc-sparse-doublet-omp${{ matrix.omp }}/
          retention-days: 21
          if-no-files-found: warn
