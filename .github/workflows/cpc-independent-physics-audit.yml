name: CPC independent small-system physics reference audit

on:
  push:
    branches:
      - codex/ed2-cpc-stationary-dm-scaling
    paths:
      - "paper/audit_reference_small_systems.py"
      - "docs/development/cpc-stationary-dm-reference.csv"
      - ".github/workflows/cpc-independent-physics-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-stationary-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent reference dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2"
      - name: Build independent mixed-spin matrices and audit CSV
        run: |
          python paper/audit_reference_small_systems.py \
            --csv docs/development/cpc-stationary-dm-reference.csv \
            --report independent-stationary-audit.json
      - name: Archive independent numerical verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-independent-small-system-physics-report
          path: independent-stationary-audit.json
          retention-days: 30
          if-no-files-found: warn
