name: CPC interacting avoided-crossing numerical validation

on:
  push:
    branches:
      - codex/ed2-cpc-interacting-avoided-crossing
    paths:
      - ".github/workflows/cpc-interacting-crossing.yml"
      - "tests/mixed_spin_*.py"
      - "tests/Makefile.am"
      - "source/**"
      - "configure.ac"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-crossing:
    name: "Interacting crossing (GNU 13 / OMP=${{ matrix.threads }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        threads: [1, 2]
    env:
      FC: gfortran-13
      FCFLAGS: "-O2 -fopenmp"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Fortran toolchain and test-only dense reference
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran-13 libopenblas-dev liblapack-dev autoconf automake make python3-numpy
      - name: Rebuild from an independent release tarball
        run: |
          set -eu
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          make dist
          work="$RUNNER_TEMP/ed2-avoided"
          mkdir -p "$work/src" "$work/build"
          archive=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          tar -xzf "$archive" -C "$work/src"
          src=$(find "$work/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          printf '%s\n' "$src" > "$work/source-path"
          cd "$work/build"
          "$src/configure" FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Check level repulsion, ground observables and low-doublet invariants
        run: |
          set -eu
          work="$RUNNER_TEMP/ed2-avoided"
          src=$(cat "$work/source-path")
          python3 "$src/tests/mixed_spin_interacting_avoided_crossing.py" \
            --exe "$work/build/source/QS3ED2" \
            --omp "${{ matrix.threads }}" \
            --output "$work/results-omp${{ matrix.threads }}"
          python3 - "$work/results-omp${{ matrix.threads }}/report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print("INTERACTING SUMMARY:",d["completed"],"of",d["expected"],
                "accepted",d["accepted"],
                "nonconverged",d["nonconverged"],
                "unresolved individually",d["individually_unresolved"],
                "contract violations",len(d["violations"]))
          if d["completed"]!=54 or d["expected"]!=54 or d["violations"]:
              raise SystemExit("Interacting avoided-crossing validation failed")
          if any(not (x["outer_gap"]>.2 and x["ground_gap"]>1e-10)
                 for x in d["independent_models"]):
              raise SystemExit("Incorrect physical reference low-energy isolation")
          reliable=[x for x in d["trials"] if x["epsilon"]==.02]
          if len(reliable)!=30 or any(
              x["status"]!=0 or x["classification"]!="accepted_correct_individual_ground"
              for x in reliable):
              raise SystemExit("Well-split interacting ground results did not pass")
          if any(x["alg"]==2 and x["status"]==0 and
                 not ("cluster_ensemble_mag_error" in x and
                      "cluster_ensemble_cf_error" in x)
                 for x in d["trials"]):
              raise SystemExit("Missing trace-based low-cluster checks")
          PY
      - name: Retain all inputs, wavefunctions, residual logs and JSON records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interacting-avoided-crossing-omp${{ matrix.threads }}
          path: ${{ runner.temp }}/ed2-avoided/results-omp${{ matrix.threads }}/
          if-no-files-found: warn
          retention-days: 14
