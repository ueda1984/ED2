name: Phase 2-B archive numerical verification

on:
  push:
    branches:
      - codex/ed2-phase2b-release-audit
    paths:
      - ".github/workflows/archive-numerical-verification.yml"
      - "Makefile.am"
      - "configure.ac"
      - "source/**"
      - "tests/**"
      - "tools/**"
      - "script_*/**"
      - "input/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-independent:
    name: "Archive numerical tests (${{ matrix.fc }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            fc: gfortran-11
          - os: ubuntu-24.04
            fc: gfortran-13
    env:
      FC: ${{ matrix.fc }}
      FCFLAGS: "-O2 -fopenmp"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain and independent-test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${FC}" libopenblas-dev liblapack-dev autoconf automake make python3-numpy
      - name: Build distributable archive
        run: |
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          make dist
          ls -lh ./*.tar.gz
      - name: Build only from the archived source tree
        run: |
          set -eu
          WORK="$RUNNER_TEMP/ed2-archive-numerics"
          mkdir -p "$WORK/source" "$WORK/build"
          tarball=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$tarball"
          tar -xzf "$tarball" -C "$WORK/source"
          source_dir=$(find "$WORK/source" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$source_dir/configure"
          printf '%s\n' "$source_dir" > "$WORK/srcpath"
          cd "$WORK/build"
          "$source_dir/configure" FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
          "$FC" --version | head -n 1
          python3 -c 'import numpy; print("NumPy", numpy.__version__)'
      - name: Independent 21-case Hamiltonian, sectors, observables validation
        run: |
          set -eu
          WORK="$RUNNER_TEMP/ed2-archive-numerics"
          source_dir=$(cat "$WORK/srcpath")
          python3 "$source_dir/tests/numerical_baseline.py" \
            --exe "$WORK/build/source/QS3ED2" \
            --output "$WORK/independent-numerics"
          python3 - "$WORK/independent-numerics/report.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding='utf-8'))
          print('Independent cases:',report['passed'],'passed;',report['failed'],'failed')
          if report['passed']!=21 or report['failed']!=0 or len(report['cases'])!=21:
              raise SystemExit('Independent numerical verification incomplete or failed')
          PY
      - name: LAPACK interface and error-path validation
        run: |
          cd "$RUNNER_TEMP/ed2-archive-numerics/build"
          make check-lapack
      - name: Independent sparse-field operator and CLI validation
        run: |
          cd "$RUNNER_TEMP/ed2-archive-numerics/build"
          make check-sparse-field
      - name: Iterative solver stability validation
        run: |
          cd "$RUNNER_TEMP/ed2-archive-numerics/build"
          make check-lanczos
      - name: Solver diagnostic/seed reproducibility validation
        run: |
          cd "$RUNNER_TEMP/ed2-archive-numerics/build"
          make check-diagnostics
      - name: Opt-in residual convergence contract validation
        run: |
          cd "$RUNNER_TEMP/ed2-archive-numerics/build"
          make check-residual-policy
