name: CPC interacting eight-site ultra-narrow spectral stress

on:
  push:
    branches:
      - codex/ed2-cpc-stationary-dm-scaling
    paths:
      - ".github/workflows/cpc-interacting-ultranarrow.yml"
      - "tests/cpc_interacting_ultranarrow_probe.py"
      - "tests/plot_cpc_interacting_ultranarrow.py"
      - "docs/development/cpc-interacting-ultranarrow-raw-ci.csv"
      - "tests/cpc_stationary_interacting_sparse_doublet.py"
      - "tests/mixed_spin_interacting_avoided_crossing.py"
      - "tests/mixed_spin_sparse_scale.py"
      - "tests/Makefile.am"
      - "source/**"
      - "configure.ac"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ultra:
    name: "Ultra-narrow interacting gap OMP=${{ matrix.omp }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        omp: [1,2]
    env:
      FC: gfortran-13
      FCFLAGS: "-O2 -fopenmp"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and independent sparse reference dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran-13 libopenblas-dev liblapack-dev autoconf automake make python3-numpy python3-scipy time
      - name: Build from a separately extracted source archive
        run: |
          set -eu
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          make dist
          root="$RUNNER_TEMP/ed2-ultra-interacting"
          mkdir -p "$root/src" "$root/build"
          archive=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          tar -xzf "$archive" -C "$root/src"
          src=$(find "$root/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$src/tests/cpc_interacting_ultranarrow_probe.py"
          printf '%s\n' "$src" > "$root/source-path"
          cd "$root/build"
          "$src/configure" FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Characterize near-residual-limit states without treating accepted excited pairs as ground
        run: |
          set -eu
          root="$RUNNER_TEMP/ed2-ultra-interacting"
          src=$(cat "$root/source-path")
          python3 "$src/tests/cpc_interacting_ultranarrow_probe.py" \
            --exe "$root/build/source/QS3ED2" \
            --omp "${{ matrix.omp }}" \
            --output "$RUNNER_TEMP/cpc-ultra-omp${{ matrix.omp }}"
          python3 - "$RUNNER_TEMP/cpc-ultra-omp${{ matrix.omp }}/report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["pass_complete"],d["harness_violations"]
          assert d["classified"]==d["expected"]==12
          assert d["accepted"]+d["honest_nonconvergence"]==12
          assert d["scenarios_with_accepted_pair"]
          assert all(x["effective_low_gap_error"] is not None and
                     x["effective_low_gap_error"]<1e-9 for x in d["source_references"])
          for r in d["raw"]:
              if r["status"]==0:
                  assert r["direct_residuals"]
                  assert max(r["direct_residuals"])<=r["requested_atol"]*(1+1e-12)
                  assert r["trace_mag_max_error"]<=1e-5
                  assert r["trace_corr_max_error"]<=1e-5
          print("ULTRA-NARROW NUMERICAL CLASSIFICATION",d["classified"],"/",d["expected"],
                "accepted",d["accepted"],"nonconverged",d["honest_nonconvergence"],
                "individual unresolved",d["individually_unresolved"])
          PY
      - name: Preserve full near-degeneracy controls and native output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-interacting-ultra-omp${{ matrix.omp }}
          path: ${{ runner.temp }}/cpc-ultra-omp${{ matrix.omp }}/
          retention-days: 21
          if-no-files-found: warn

  frozen-figures:
    name: Audit 24 frozen ultra-small-gap classifications and render plots
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install reproducible headless plotting dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-matplotlib python3-numpy
      - name: Check source identity and the complete accepted-case matrix
        run: |
          set -eu
          python3 tests/plot_cpc_interacting_ultranarrow.py --validate-only
      - name: Render individual-versus-projector precision plots
        run: |
          set -eu
          python3 tests/plot_cpc_interacting_ultranarrow.py \
            --outdir "$RUNNER_TEMP/cpc-ultra-figures"
          test "$(find "$RUNNER_TEMP/cpc-ultra-figures" -name '*.svg' | wc -l)" -eq 3
          test "$(find "$RUNNER_TEMP/cpc-ultra-figures" -name '*.png' | wc -l)" -eq 3
          sha256sum "$RUNNER_TEMP/cpc-ultra-figures"/*.svg
      - name: Archive reproducible numerical precision figure prototypes
        uses: actions/upload-artifact@v4
        with:
          name: cpc-ultra-doublet-figures
          path: ${{ runner.temp }}/cpc-ultra-figures/
          retention-days: 21
          if-no-files-found: error
