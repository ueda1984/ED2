name: ED2 citation metadata and archived ex9 integrity

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
    paths:
      - "CITATION.cff"
      - "configure.ac"
      - "source/**"
      - "tests/**"
      - "script_*/**"
      - "docs/**"
      - "input/**"
      - "README.md"
      - "LICENSE"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - "examples/ref_data/**"
      - "tests/check_release_metadata.py"
      - "tests/test_release_guards.py"
      - "tests/release_archive_preflight.py"
      - "Makefile.am"
      - "tests/verify_ex9.py"
      - "tests/run_ex9_reproducibility.sh"
      - ".github/workflows/release-readiness.yml"
  pull_request:
    paths:
      - "CITATION.cff"
      - "configure.ac"
      - "source/**"
      - "tests/**"
      - "script_*/**"
      - "docs/**"
      - "input/**"
      - "README.md"
      - "LICENSE"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - "examples/ref_data/**"
      - "tests/check_release_metadata.py"
      - "tests/test_release_guards.py"
      - "tests/release_archive_preflight.py"
      - "Makefile.am"
      - "tests/verify_ex9.py"
      - "tests/run_ex9_reproducibility.sh"
      - ".github/workflows/release-readiness.yml"
  workflow_dispatch:

jobs:
  release-metadata-and-reference:
    name: Citation and archived ex9 integrity (no ex9 compute)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check compute-node wrapper without executing ex9
        run: sh -n tests/run_ex9_reproducibility.sh
      - name: Validate citation metadata for development or proposed release tag
        shell: bash
        env:
          GIT_REF_TYPE: ${{ github.ref_type }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GIT_REF_TYPE" = tag ]; then
            python3 -B tests/check_release_metadata.py --release-tag "$GIT_REF_NAME"
          else
            python3 -B tests/check_release_metadata.py
          fi
      - name: Validate archived ex9 energies, full observable files, and spin sum rule
        run: |
          python3 -B tests/test_release_guards.py
          python3 -B tests/verify_ex9.py \
            --json-out "${{ runner.temp }}/ex9-archive-check.json"
          python3 -B tests/test_ex9_legacy_projection.py
      - name: Preserve archive validation JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ed2-ex9-archived-reference-check
          path: ${{ runner.temp }}/ex9-archive-check.json
          if-no-files-found: warn
          retention-days: 30

  source-distcheck:
    name: Standalone GNU source-distribution reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler, BLAS/LAPACK and Autotools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc gfortran make autoconf automake libopenblas-dev liblapack-dev
      - name: Build and independently unpack/check packaged source
        run: |
          autoreconf -vfi
          ./configure FC=gfortran FCFLAGS="-O2 -fopenmp"
          make -j2
          make distcheck
          make dist
          metadata_args=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            metadata_args=(--release-tag "$GITHUB_REF_NAME")
          fi
          shopt -s nullglob
          archives=(./*.tar.gz)
          test "${#archives[@]}" -eq 1
          python3 -B tests/release_archive_preflight.py \
            --archive "${archives[0]}" \
            --expected-commit "$(git rev-parse HEAD)" \
            "${metadata_args[@]}" \
            --json-out "$RUNNER_TEMP/gnu-release-source-manifest.json"
      - name: Preserve the exact checked GNU source archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: ed2-checked-gnu-source-distribution
          path: |
            ./*.tar.gz
            ${{ runner.temp }}/gnu-release-source-manifest.json
          if-no-files-found: error
          retention-days: 30
