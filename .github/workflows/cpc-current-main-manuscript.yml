name: CPC ED2 current-main CPiP manuscript and physics proof

on:
  push:
    branches: [paper/ed2-cpip-current-main-20261119]
    paths:
      - "paper/**"
      - "source/ham2vec.f90"
      - ".github/workflows/cpc-current-main-manuscript.yml"
  pull_request:
    paths:
      - "paper/**"
      - "source/ham2vec.f90"
      - ".github/workflows/cpc-current-main-manuscript.yml"
  workflow_dispatch:

concurrency:
  group: cpc-ed2-paper-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    name: Typeset CPC CPiP and validate source-pinned figures
    steps:
      - uses: actions/checkout@v4
      - name: Install Elsevier LaTeX and PDF text extraction
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            texlive-latex-base texlive-latex-recommended \
            texlive-publishers texlive-pictures poppler-utils
      - name: Exact editorial scientific data, memory and pilot source checks
        run: |
          python3 -S paper/check_dm_figure.py --self-test
          python3 -S paper/check_pr17_presto_table.py
          python3 -S paper/check_mainline_cache_claims.py --self-test
          python3 -S paper/check_current_main_native_dm.py --self-test
          mkdir -p "$RUNNER_TEMP/cpc-paper"
          python3 -S paper/audit_cpc_submission.py \
            --repo "$PWD" --output "$RUNNER_TEMP/cpc-paper/readiness.json"
          # A preapproved release does not exist; --require-ready must
          # accurately REFUSE to certify submission in this Draft.
          if python3 -S paper/audit_cpc_submission.py \
              --repo "$PWD" --require-ready > "$RUNNER_TEMP/cpc-paper/strict-audit.log"; then
            echo "ERROR: Provisional paper incorrectly passed submission gates" >&2
            exit 1
          fi
      - name: Build Elsevier PDF twice and preserve full audit
        run: |
          set -eu
          for pass in 1 2; do
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error \
              -output-directory="$RUNNER_TEMP/cpc-paper" \
              paper/cpc_ed2_main.tex \
              > "$RUNNER_TEMP/cpc-paper/tex-pass$pass.stdout"
          done
          test -s "$RUNNER_TEMP/cpc-paper/cpc_ed2_main.pdf"
          pdfinfo "$RUNNER_TEMP/cpc-paper/cpc_ed2_main.pdf" \
            > "$RUNNER_TEMP/cpc-paper/pdfinfo.txt"
          pdftotext -layout "$RUNNER_TEMP/cpc-paper/cpc_ed2_main.pdf" \
            "$RUNNER_TEMP/cpc-paper/article-text.txt"
          grep -q 'ED2: Generalized exact diagonalization' \
            "$RUNNER_TEMP/cpc-paper/article-text.txt"
          grep -q 'complex' "$RUNNER_TEMP/cpc-paper/article-text.txt"
          grep -q 'Conclusions' "$RUNNER_TEMP/cpc-paper/article-text.txt"
          sha256sum paper/cpc_ed2_main.tex "$RUNNER_TEMP/cpc-paper/cpc_ed2_main.pdf" \
            > "$RUNNER_TEMP/cpc-paper/source-pdf-sha256.txt"
          echo "CPC_CURRENT_MAIN_LATEX_EDITORIAL_PASS"
      - name: Archive provisional manuscript (NOT a journal submission)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-ed2-current-main-review-pdf
          path: ${{ runner.temp }}/cpc-paper/
          retention-days: 30
          if-no-files-found: warn

  independent-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    name: Independently reconstruct small mixed-spin DM reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independent numerical reference packages
        run: python -m pip install numpy scipy
      - name: Independently verify 15 real/complex DM reference points
        run: |
          mkdir -p "$RUNNER_TEMP/cpc-physics"
          python3 paper/audit_reference_small_systems.py \
            --csv paper/data/cpc-stationary-dm-reference.csv \
            --report "$RUNNER_TEMP/cpc-physics/independent-15-physics.json"
      - name: Archive reference audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-ed2-independent-science
          path: ${{ runner.temp }}/cpc-physics/
          if-no-files-found: warn

  program-example:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    name: Reproduce 4-site physical DM response on generic main
    steps:
      - uses: actions/checkout@v4
      - name: Build current mainline Fortran solver with typed LP64 BLAS/LAPACK
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gfortran-14 libopenblas-dev liblapack-dev autoconf automake make
          autoreconf -vfi
          ./configure FC=gfortran-14 FCFLAGS="-O2 -fopenmp"
          make -j2
          make check
      - name: End-user portable scientific DM/Hellmann-Feynman example
        run: |
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          python3 -S paper/tools/cpc_portable_dm_quickstart.py \
            --exe "$PWD/source/QS3ED2" --size 4 --omp 1 \
            --output "$RUNNER_TEMP/cpc-physical-dm"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'cpc-physical-dm'
          report=json.loads((root/'report.json').read_text())
          assert report['pass_complete'] is True
          assert report['size']==4
          assert all(row['diagnostic']['kind']=='original_main_no_direct_residual_sidecar'
                     for row in report['rows'])
          assert all(row['diagnostic']['direct_residual_certified'] is False
                     for row in report['rows'])
          assert report['metrics']['HF_abs_error'] < 3e-5
          print("CPC_CURRENT_MAIN_PHYSICAL_DM_REPRO_PASS size=4")
          PY
      - name: Reproduce six-site native DM/Hellmann-Feynman physical reference
        run: |
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          python3 -S paper/tools/cpc_portable_dm_quickstart.py \
            --exe "$PWD/source/QS3ED2" --size 6 --omp 1 \
            --output "$RUNNER_TEMP/cpc-physical-dm-l6"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'cpc-physical-dm-l6'
          report=json.loads((root/'report.json').read_text())
          assert report['pass_complete'] is True
          assert report['size']==6
          assert all(not row['diagnostic']['direct_residual_certified']
                     for row in report['rows'])
          assert report['metrics']['HF_abs_error'] < 3e-5
          print("CPC_CURRENT_MAIN_PHYSICAL_DM_REPRO_PASS size=6")
          PY
      - name: Preserve actual current-code physical source and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-ed2-current-main-native-dm
          path: |
            ${{ runner.temp }}/cpc-physical-dm/
            ${{ runner.temp }}/cpc-physical-dm-l6/
          retention-days: 21
          if-no-files-found: warn
