name: CPC stationary DM full-cache MNTE capacity

on:
  push:
    branches:
      - codex/ed2-cpc-stationary-dm-scaling
    paths:
      - ".github/workflows/cpc-stationary-mnte.yml"
      - "tests/cpc_stationary_mnte_capacity.py"
      - "tests/mixed_spin_matched_benchmark.py"
      - "tests/cpc_stationary_resource_benchmark.py"
      - "tests/mixed_spin_dm_chirality_scan.py"
      - "tests/Makefile.am"
      - "source/**"
      - "configure.ac"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity:
    name: "MNTE ${{ matrix.tag }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: "small-omp1", threads: 1, sizes: "8,10", algs: "1,2"}
          - {tag: "small-omp2", threads: 2, sizes: "8,10", algs: "1,2"}
          - {tag: "large-omp1", threads: 1, sizes: "12", algs: "1,2"}
          - {tag: "large-omp2", threads: 2, sizes: "12", algs: "1,2"}
    env:
      FC: gfortran-13
      FCFLAGS: "-O2 -fopenmp"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Fortran and SciPy independent reference
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran-13 libopenblas-dev liblapack-dev autoconf automake make python3-numpy python3-scipy time
      - name: Build separately extracted source archive
        run: |
          set -eu
          autoreconf -vfi
          ./configure FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          make dist
          tmp="$RUNNER_TEMP/ed2-mnte"
          mkdir -p "$tmp/src" "$tmp/build"
          tgz=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$tgz"
          tar -xzf "$tgz" -C "$tmp/src"
          src=$(find "$tmp/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$src/tests/cpc_stationary_mnte_capacity.py"
          printf '%s\n' "$src" > "$tmp/source-path"
          cd "$tmp/build"
          "$src/configure" FC="$FC" FCFLAGS="$FCFLAGS"
          make -j2
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Full-cache default versus observed optimum MNTE
        run: |
          set -eu
          tmp="$RUNNER_TEMP/ed2-mnte"
          src=$(cat "$tmp/source-path")
          python3 "$src/tests/cpc_stationary_mnte_capacity.py" \
            --exe "$tmp/build/source/QS3ED2" \
            --sizes "${{ matrix.sizes }}" \
            --algs "${{ matrix.algs }}" \
            --omp "${{ matrix.threads }}" \
            --D 0.12 --residual-atol 1e-8 \
            --workspaces 2:16 --repeats 2 --warmups 1 \
            --output "$RUNNER_TEMP/mnte-${{ matrix.tag }}"
          python3 - "$RUNNER_TEMP/mnte-${{ matrix.tag }}/report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["pass_complete"],d["contract_violations"]
          assert d["expected"]==d["completed"]==d["successful"]
          assert all(c["optimal_mnte"]<=c["default_mnte"] for c in d["capacity_calibration"])
          assert all(s["successful_measurements"]==s["target"] for s in d["summary"])
          print("MNTE CAPACITY VERIFIED:",d["completed"],"/",d["expected"],
                "calibrations:",d["capacity_calibration"])
          PY
      - name: Archive inputs, capacity counters, diagnostics and raw resources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc-stationary-mnte-${{ matrix.tag }}
          path: ${{ runner.temp }}/mnte-${{ matrix.tag }}/
          retention-days: 21
          if-no-files-found: warn
