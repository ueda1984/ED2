site_name: ED2 Documentation
repo_url: https://github.com/QS-Cube/ED2

theme:
  name: material

docs_dir: docs

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: true
      
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - User Guide:
      - Input format: user-guide/input-format.md
      - Outputs: user-guide/outputs.md
      - Solver accuracy and reproducibility: user-guide/solver-accuracy.md
  - Examples:
      - Chain: examples/chain.md
      - J1–J2 chain: examples/j1j2_chain.md
      - Mixed-spin chain: examples/mixed_spin_chain.md
      - Square lattice: examples/square.md
      - Triangular lattice: examples/triangular.md
      - Honeycomb lattice: examples/honeycomb.md
      - Kagome lattice: examples/kagome.md
      - Cubic lattice: examples/cubic.md
      - Cubic (sp_HB): examples/cubic_sp_HB.md      
  - Performance:
      - wk_dim scaling: vp/wk_dim_scaling.md
      - mixed_spin_plateau: vp/mixed_spin_plateau.md
      - symmetry_breaking_response: vp/symmetry_breaking_response.md
  - Theory / Algorithms:
      - Overview: theory/algorithms.md
  - Development:
      - Baseline audit: development/baseline-audit.md
      - CPC library plan: development/cpc-library-plan.md
      - Phase 1 LAPACK interfaces: development/phase1-lapack-interfaces.md
      - Phase 1-B sparse fields: development/phase1b-sparse-field-indexing.md
      - Phase 1-C Lanczos stability: development/phase1c-lanczos-stability.md
      - Phase 1-D stress and benchmarks: development/phase1d-krylov-stress-benchmarks.md
      - Phase 1-D policy proposals: development/phase1d-policy-proposals.md
      - Phase 1-E precision contract: development/phase1e-precision-contract.md
      - Phase 1-E validation: development/phase1e-validation.md
      - Phase 1-F diagnostics and reproducibility: development/phase1f-diagnostics-reproducibility.md
      - Phase 1-G opt-in residual policy: development/phase1g-optin-residual-policy.md
      - Read the Docs release workflow: development/readthedocs-workflow.md
      - Phase 2-A distribution readiness: development/phase2a-distribution-readiness.md
      - Phase 2-B independent validation and metadata audit: development/phase2b-release-audit.md
      - CPC manuscript plan (working draft): development/cpc-manuscript-outline.md
      - CPC mixed-spin non-U1 scientific demonstration: development/cpc-mixed-spin-demo.md
  - Reference:
      - Citation & Versioning: reference/citation-versioning.md      
